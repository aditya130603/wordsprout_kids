name: Private Friends League API tests
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'assets/content/older_missions_v1.json'
      - '.github/workflows/league-tests.yml'
  workflow_dispatch:
jobs:
  verify-league:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend Python
        run: python -m compileall -q backend
      - name: Verify parent approval and scoring
        run: python -m pytest -q backend/test_friends_server.py
