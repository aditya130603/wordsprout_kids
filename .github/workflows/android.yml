name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate and validate 130 offline SVG assets
        run: python3 scripts/build_assets.py
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name wordsprout_kids .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Capture Flutter UI screenshots
        run: |
          flutter test --update-goldens test/screenshot_test.dart
          flutter test --update-goldens test/older_screenshot_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordsprout-ui-screenshots
          path: test/screenshots/*.png
          if-no-files-found: warn
      - name: Test
        run: flutter test
      - name: Verify bundled user-supplied PNG sequences
        run: python3 scripts/verify_starter_pack.py
      - name: Build release APK
        run: flutter build apk --release --dart-define=WORDSPROUT_CONTENT_URL="${{ vars.WORDSPROUT_CONTENT_URL }}" --dart-define=WORDSPROUT_FRIENDS_API_URL="${{ vars.WORDSPROUT_FRIENDS_API_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: wordsprout-kids-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
